# One-off notebook-only worker build from the pinned, deployed dependency image.
# Do not use when app.py, hosted/, or runtime dependencies have changed.
substitutions:
  _REGISTRY: europe-west1-docker.pkg.dev/getmuzoboz/competitive-audit
  _TAG: development
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - hosted/Dockerfile.worker.overlay
      - -t
      - ${_REGISTRY}/worker:${_TAG}
      - .
images:
  - ${_REGISTRY}/worker:${_TAG}
