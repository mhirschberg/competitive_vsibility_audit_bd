name: Verify generated notebook

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  notebook-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated notebook is up to date
        run: python scripts/build_notebook.py --check
