<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 585" role="img" aria-labelledby="title description">
  <title id="title">Hosted application architecture</title>
  <desc id="description">A browser loads the interface from Firebase Hosting and signs in through Supabase. Cloud Run API records the request in Supabase and dispatches a dedicated worker through Cloud Tasks. The worker calls Bright Data and saves progress and report files in Supabase. A watchdog checks active jobs only; a scheduled cleanup removes expired anonymous workshop data.</desc>
  <defs>
    <marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#6b8378"/>
    </marker>
  </defs>
  <rect width="1320" height="585" rx="18" fill="#f6f3eb"/>
  <text x="40" y="42" fill="#4a6659" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">HOSTED APPLICATION</text>
  <text x="40" y="73" fill="#173d34" font-family="Arial, sans-serif" font-size="19">A short-lived worker does the expensive work; the browser can close and return later.</text>

  <rect x="40" y="105" width="190" height="116" rx="12" fill="#fffefb" stroke="#c8d4c7" stroke-width="2"/>
  <text x="59" y="138" fill="#ec683e" font-family="Arial, sans-serif" font-size="14" font-weight="700">PARTICIPANT</text>
  <text x="59" y="174" fill="#173d34" font-family="Arial, sans-serif" font-size="23" font-weight="700">Browser</text>
  <text x="59" y="201" fill="#51675b" font-family="Arial, sans-serif" font-size="16">Start / status / files</text>

  <rect x="275" y="105" width="215" height="116" rx="12" fill="#fffefb" stroke="#c8d4c7" stroke-width="2"/>
  <text x="294" y="138" fill="#ec683e" font-family="Arial, sans-serif" font-size="14" font-weight="700">FRONTEND</text>
  <text x="294" y="174" fill="#173d34" font-family="Arial, sans-serif" font-size="22" font-weight="700">Firebase Hosting</text>
  <text x="294" y="201" fill="#51675b" font-family="Arial, sans-serif" font-size="16">audit.qaviso.com</text>

  <rect x="535" y="105" width="215" height="116" rx="12" fill="#e5efe7" stroke="#9bb8a7" stroke-width="2"/>
  <text x="554" y="138" fill="#ec683e" font-family="Arial, sans-serif" font-size="14" font-weight="700">GOOGLE CLOUD</text>
  <text x="554" y="174" fill="#173d34" font-family="Arial, sans-serif" font-size="22" font-weight="700">Cloud Run API</text>
  <text x="554" y="201" fill="#51675b" font-family="Arial, sans-serif" font-size="16">Admission / audit status</text>

  <rect x="800" y="105" width="480" height="116" rx="12" fill="#fffefb" stroke="#c8d4c7" stroke-width="2"/>
  <text x="819" y="138" fill="#ec683e" font-family="Arial, sans-serif" font-size="14" font-weight="700">SEPARATE SUPABASE PROJECT</text>
  <text x="819" y="174" fill="#173d34" font-family="Arial, sans-serif" font-size="23" font-weight="700">Auth / Postgres / private Storage</text>
  <text x="819" y="201" fill="#51675b" font-family="Arial, sans-serif" font-size="16">Sessions / quotas / history / reports</text>

  <g fill="none" stroke="#6b8378" stroke-width="3" marker-end="url(#flow-arrow)">
    <path d="M230 163 H272"/>
    <path d="M135 221 V260 H555 V224"/>
    <path d="M750 163 H797"/>
    <path d="M600 221 V310"/>
    <path d="M700 221 V283 H909 V310"/>
    <path d="M1020 372 H1065"/>
    <path d="M909 313 V223"/>
  </g>
  <text x="313" y="251" fill="#51675b" font-family="Arial, sans-serif" font-size="14">direct API request</text>

  <rect x="535" y="313" width="215" height="116" rx="12" fill="#e5efe7" stroke="#9bb8a7" stroke-width="2"/>
  <text x="554" y="346" fill="#ec683e" font-family="Arial, sans-serif" font-size="14" font-weight="700">DISPATCH + HEALTH</text>
  <text x="554" y="381" fill="#173d34" font-family="Arial, sans-serif" font-size="21" font-weight="700">Tasks / watchdog</text>
  <text x="554" y="408" fill="#51675b" font-family="Arial, sans-serif" font-size="16">Checks active audits only</text>

  <rect x="800" y="313" width="220" height="116" rx="12" fill="#173d34"/>
  <text x="819" y="346" fill="#f4ad8c" font-family="Arial, sans-serif" font-size="14" font-weight="700">ONE JOB PER AUDIT</text>
  <text x="819" y="381" fill="#fffefb" font-family="Arial, sans-serif" font-size="22" font-weight="700">Cloud Run worker</text>
  <text x="819" y="408" fill="#d9e7db" font-family="Arial, sans-serif" font-size="16">Runs notebook engine</text>

  <rect x="1068" y="313" width="212" height="116" rx="12" fill="#fff7ee" stroke="#e7b298" stroke-width="2"/>
  <text x="1087" y="346" fill="#b55130" font-family="Arial, sans-serif" font-size="14" font-weight="700">LIVE DATA</text>
  <text x="1087" y="381" fill="#173d34" font-family="Arial, sans-serif" font-size="22" font-weight="700">Bright Data</text>
  <text x="1087" y="408" fill="#51675b" font-family="Arial, sans-serif" font-size="16">Search / AI / Reddit</text>

  <path d="M800 466 H1280" stroke="#c8d4c7" stroke-width="2"/>
  <text x="800" y="496" fill="#173d34" font-family="Arial, sans-serif" font-size="18" font-weight="700">After completion</text>
  <text x="800" y="523" fill="#51675b" font-family="Arial, sans-serif" font-size="16">Worker stops; report remains available to its owner.</text>
  <text x="40" y="548" fill="#51675b" font-family="Arial, sans-serif" font-size="15">An hourly cleanup removes expired anonymous workshop data after its configured retention window; registered reports remain.</text>
</svg>
