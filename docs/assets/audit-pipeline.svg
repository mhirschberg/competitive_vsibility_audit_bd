<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 390" role="img" aria-labelledby="title description">
  <title id="title">How one competitive visibility audit works</title>
  <desc id="description">The audit turns a company and optional focus into neutral buyer questions, observes search, validates two direct competitors, compares AI answers, optionally analyses Reddit, and builds a sourced report.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#6b8378"/>
    </marker>
  </defs>
  <rect width="1320" height="390" rx="18" fill="#f6f3eb"/>
  <text x="40" y="43" fill="#4a6659" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">THE AUDIT METHOD</text>
  <text x="40" y="74" fill="#173d34" font-family="Arial, sans-serif" font-size="19">The company name stays out of the buyer questions.</text>

  <g fill="none" stroke="#6b8378" stroke-width="3" marker-end="url(#arrow)">
    <path d="M235 178 H273"/>
    <path d="M480 178 H518"/>
    <path d="M745 178 H783"/>
    <path d="M1010 178 H1048"/>
    <path d="M631 239 V301 H782"/>
    <path d="M1010 316 H1145 V241"/>
  </g>

  <rect x="40" y="116" width="195" height="125" rx="12" fill="#fffefb" stroke="#c8d4c7" stroke-width="2"/>
  <text x="59" y="144" fill="#ec683e" font-family="Arial, sans-serif" font-size="14" font-weight="700">01 / SCOPE</text>
  <text x="59" y="174" fill="#173d34" font-family="Arial, sans-serif" font-size="20" font-weight="700">Company + focus</text>
  <text x="59" y="201" fill="#51675b" font-family="Arial, sans-serif" font-size="16">Country and category</text>

  <rect x="273" y="116" width="207" height="125" rx="12" fill="#fffefb" stroke="#c8d4c7" stroke-width="2"/>
  <text x="292" y="144" fill="#ec683e" font-family="Arial, sans-serif" font-size="14" font-weight="700">02 / DISCOVER</text>
  <text x="292" y="174" fill="#173d34" font-family="Arial, sans-serif" font-size="20" font-weight="700">Neutral questions</text>
  <text x="292" y="201" fill="#51675b" font-family="Arial, sans-serif" font-size="16">Search evidence</text>

  <rect x="518" y="116" width="227" height="125" rx="12" fill="#fffefb" stroke="#c8d4c7" stroke-width="2"/>
  <text x="537" y="144" fill="#ec683e" font-family="Arial, sans-serif" font-size="14" font-weight="700">03 / VALIDATE</text>
  <text x="537" y="174" fill="#173d34" font-family="Arial, sans-serif" font-size="20" font-weight="700">Two direct rivals</text>
  <text x="537" y="201" fill="#51675b" font-family="Arial, sans-serif" font-size="16">Same market role</text>

  <rect x="783" y="116" width="227" height="125" rx="12" fill="#e5efe7" stroke="#9bb8a7" stroke-width="2"/>
  <text x="802" y="144" fill="#ec683e" font-family="Arial, sans-serif" font-size="14" font-weight="700">04 / MEASURE</text>
  <text x="802" y="174" fill="#173d34" font-family="Arial, sans-serif" font-size="20" font-weight="700">AI answer engines</text>
  <text x="802" y="201" fill="#51675b" font-family="Arial, sans-serif" font-size="16">Same buyer need</text>

  <rect x="1048" y="116" width="232" height="125" rx="12" fill="#173d34"/>
  <text x="1067" y="144" fill="#f4ad8c" font-family="Arial, sans-serif" font-size="14" font-weight="700">05 / EXPLAIN</text>
  <text x="1067" y="174" fill="#fffefb" font-family="Arial, sans-serif" font-size="20" font-weight="700">Sourced report</text>
  <text x="1067" y="201" fill="#d9e7db" font-family="Arial, sans-serif" font-size="16">PDF / Markdown / JSON</text>

  <rect x="783" y="275" width="227" height="83" rx="12" fill="#fff7ee" stroke="#e7b298" stroke-width="2"/>
  <text x="802" y="302" fill="#b55130" font-family="Arial, sans-serif" font-size="14" font-weight="700">OPTIONAL / SOCIAL</text>
  <text x="802" y="332" fill="#173d34" font-family="Arial, sans-serif" font-size="19" font-weight="700">Reddit conversations</text>
  <text x="40" y="365" fill="#51675b" font-family="Arial, sans-serif" font-size="14">Search coverage, AI mentions, citations and Reddit conversations remain separate signals, not one synthetic score.</text>
</svg>
